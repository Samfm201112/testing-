name: 24/7 3-Hour Shifts GTA 6 Clipper

on:
  schedule:
    # Runs 8 back-to-back 3-hour shifts covering all 24 hours of Hong Kong Time (HKT):
    # 00:00 UTC = 8:00 AM HKT  | 03:00 UTC = 11:00 AM HKT
    # 06:00 UTC = 2:00 PM HKT  | 09:00 UTC = 5:00 PM HKT
    # 12:00 UTC = 8:00 PM HKT  | 15:00 UTC = 11:00 PM HKT
    # 18:00 UTC = 2:00 AM HKT  | 21:00 UTC = 5:00 AM HKT
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  clip-kai:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper
      - name: Clip Kai Cenat (3h Shift)
        run: timeout 172m python cloud_clipper.py "https://twitch.tv/kaicenat" || true
      - name: Save Kai Clips
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: KaiCenat-3h-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn

  clip-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper
      - name: Clip IShowSpeed (3h Shift)
        run: timeout 172m python cloud_clipper.py "https://youtube.com/@IShowSpeed/live" || true
      - name: Save Speed Clips
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: IShowSpeed-3h-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn

  clip-jynxzi:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper
      - name: Clip Jynxzi (3h Shift)
        run: timeout 172m python cloud_clipper.py "https://twitch.tv/jynxzi" || true
      - name: Save Jynxzi Clips
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Jynxzi-3h-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn
