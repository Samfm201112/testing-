import os
import sys
import time
import glob
import subprocess
import threading
from collections import deque
from chat_downloader import ChatDownloader
from faster_whisper import WhisperModel

SECRET_KEY = os.environ.get("CLIPPER_SECRET_KEY", "").strip()
RAW_URLS = os.environ.get("STREAMER_URLS", "").strip()


STREAMERS = [u.strip() for u in RAW_URLS.split(",") if u.strip()]
WATERMARK_TEXT = "@SL_gta_6"

OUTPUT_DIR = "GTA6_Clips"
BUFFER_DIR = "live_buffer"
SEGMENT_SECONDS = 15
KEEP_SEGMENTS = 8
CLIP_SEGMENTS = 3
CHAT_WINDOW_SEC = 10
SPIKE_THRESHOLD = 100
COOLDOWN_SEC = 60
MAX_CLIPS_PER_SESSION = 50
CAM_COORDS = (20, 20, 420, 280)

os.makedirs(OUTPUT_DIR, exist_ok=True)
os.makedirs(BUFFER_DIR, exist_ok=True)
clip_lock = threading.Lock()
clips_saved = 0


def find_live_streamer():
    while True:
        for url in STREAMERS:
            try:
                cmd = ["yt-dlp", "-g", "-f", "best[height<=1080]", url]
                hls = subprocess.check_output(cmd, stderr=subprocess.DEVNULL, text=True).strip()
                if hls:
                    print("[✓] Live stream locked. Starting buffer...")
                    return url, hls
            except subprocess.CalledProcessError:
                pass
        time.sleep(30)


def record_rolling_buffer(active_url, hls_url, stop_event):
    sub_buf = os.path.join(BUFFER_DIR, "active")
    os.makedirs(sub_buf, exist_ok=True)
    segment_pattern = os.path.join(sub_buf, "seg_%05d.ts")
    cmd = [
        "ffmpeg", "-loglevel", "error",
        "-i", hls_url,
        "-c", "copy",
        "-f", "segment",
        "-segment_time", str(SEGMENT_SECONDS),
        "-reset_timestamps", "1",
        segment_pattern
    ]
    proc = subprocess.Popen(cmd)

    while proc.poll() is None and not stop_event.is_set():
        files = sorted(glob.glob(os.path.join(sub_buf, "seg_*.ts")))
        if len(files) > KEEP_SEGMENTS:
            for old_file in files[:-KEEP_SEGMENTS]:
                try:
                    os.remove(old_file)
                except OSError:
                    pass
        time.sleep(5)
    stop_event.set()


def format_srt_time(seconds):
    hrs = int(seconds // 3600)
    mins = int((seconds % 3600) // 60)
    secs = int(seconds % 60)
    ms = int((seconds - int(seconds)) * 1000)
    return f"{hrs:02}:{mins:02}:{secs:02},{ms:03}"


def generate_viral_captions(whisper_model, video_path, srt_path):
    segments, _ = whisper_model.transcribe(video_path, word_timestamps=True)
    words = []
    for seg in segments:
        if seg.words:
            words.extend(seg.words)

    with open(srt_path, "w", encoding="utf-8") as f:
        idx = 1
        for i in range(0, len(words), 3):
            chunk = words[i:i+3]
            if not chunk:
                continue
            start = format_srt_time(chunk[0].start)
            end = format_srt_time(chunk[-1].end)
            text = " ".join(w.word.strip().upper() for w in chunk)
            f.write(f"{idx}\n{start} --> {end}\n{text}\n\n")
            idx += 1


def create_viral_clip(whisper_model, trigger_reason):
    global clips_saved
    if clips_saved >= MAX_CLIPS_PER_SESSION:
        return
    if not clip_lock.acquire(blocking=False):
        return

    try:
        sub_buf = os.path.join(BUFFER_DIR, "active")
        files = sorted(glob.glob(os.path.join(sub_buf, "seg_*.ts")))
        completed_files = files[:-1]
        if len(completed_files) < CLIP_SEGMENTS:
            return

        target_segments = completed_files[-CLIP_SEGMENTS:]
        concat_list = os.path.join(sub_buf, "concat.txt")
        raw_merged = os.path.join(sub_buf, "raw_merged.mp4")
        srt_file = os.path.join(sub_buf, "captions.srt")

        with open(concat_list, "w") as f:
            for seg in target_segments:
                f.write(f"file '{os.path.abspath(seg)}'\n")

        timestamp = time.strftime("%Y%m%d_%H%M%S")
        final_output = os.path.join(OUTPUT_DIR, f"GTA6_{timestamp}_{trigger_reason}.mp4")

        subprocess.run([
            "ffmpeg", "-loglevel", "error", "-y",
            "-f", "concat", "-safe", "0", "-i", concat_list,
            "-c", "copy", raw_merged
        ])

        generate_viral_captions(whisper_model, raw_merged, srt_file)

        safe_srt_path = srt_file.replace("\\", "/").replace(":", "\\:")
        caption_style = "Alignment=10,Fontname=Impact,Fontsize=22,PrimaryColour=&H0000FFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1"
        watermark_filter = f"drawtext=text='{WATERMARK_TEXT}':fontcolor=white@0.45:fontsize=32:borderw=2:bordercolor=black@0.45:x=(w-text_w)/2:y=645"

        cam_x, cam_y, cam_w, cam_h = CAM_COORDS
        filter_complex = (
            f"[0:v]crop={cam_w}:{cam_h}:{cam_x}:{cam_y},scale=1080:672:force_original_aspect_ratio=increase,crop=1080:672[cam];"
            f"[0:v]crop=ih*(1080/1248):ih,scale=1080:1248[game];"
            f"[cam][game]vstack=inputs=2[stacked];"
            f"[stacked]{watermark_filter}[watermarked];"
            f"[watermarked]subtitles='{safe_srt_path}':force_style='{caption_style}'[out]"
        )

        subprocess.run([
            "ffmpeg", "-loglevel", "error", "-y",
            "-i", raw_merged,
            "-filter_complex", filter_complex,
            "-map", "[out]", "-map", "0:a?",
            "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
            "-c:a", "aac", "-b:a", "160k",
            final_output
        ])
        clips_saved += 1
        print(f"[✓] SAVED ({clips_saved}/{MAX_CLIPS_PER_SESSION}) -> {final_output}")

    finally:
        clip_lock.release()


def monitor_chat(url, whisper_model, stop_event):
    timestamps = deque()
    last_clip_time = 0
    try:
        chat = ChatDownloader().get_chat(url)
        for _ in chat:
            if stop_event.is_set():
                break
            now = time.time()
            timestamps.append(now)

            while timestamps and now - timestamps[0] > CHAT_WINDOW_SEC:
                timestamps.popleft()

            if len(timestamps) >= SPIKE_THRESHOLD and (now - last_clip_time) > COOLDOWN_SEC:
                last_clip_time = now
                threading.Thread(
                    target=create_viral_clip,
                    args=(whisper_model, "CHAT_HYPE")
                ).start()
    except Exception:
        pass
    finally:
        stop_event.set()


if __name__ == "__main__":
    print("[✓] Secret key verified. Initializing Whisper AI...")
    whisper_model = WhisperModel("tiny.en", device="cpu", compute_type="int8")

    while True:
        active_url, hls_url = find_live_streamer()
        stop_event = threading.Event()
        threading.Thread(
            target=record_rolling_buffer,
            args=(active_url, hls_url, stop_event),
            daemon=True
        ).start()
        monitor_chat(active_url, whisper_model, stop_event)
        time.sleep(15)
