name: 24/7 3-Hour Shifts GTA 6 Clipper

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  clip-kai:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper "av<14"
      - name: Clip Kai Cenat (3h Shift)
        run: timeout 172m python cloud_clipper.py "https://twitch.tv/kaicenat" || true
      - name: Save Kai Clips
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: KaiCenat-3h-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn

  clip-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper "av<14"
      - name: Clip IShowSpeed (3h Shift)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          printf '%s\n' "$YT_COOKIES" > /tmp/cookies.txt
          timeout 172m python cloud_clipper.py "https://youtube.com/@IShowSpeed/live" || true
      - name: Save Speed Clips
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: IShowSpeed-3h-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn

  clip-jynxzi:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper "av<14"
      - name: Clip Jynxzi (3h Shift)
        run: timeout 172m python cloud_clipper.py "https://twitch.tv/jynxzi" || true
      - name: Save Jynxzi Clips
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Jynxzi-3h-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn
