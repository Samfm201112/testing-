name: 24/7 Simultaneous Kai, Speed & Jynxzi GTA 6 Clipper

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  clip-kai:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper
      - name: Clip Kai Cenat (Full Shift)
        env:
          CLIPPER_SECRET_KEY: ${{ secrets.CLIPPER_SECRET_KEY }}
          STREAMER_URLS: "https://twitch.tv"
          HIDDEN_CLIPPER_CODE: ${{ secrets.HIDDEN_CLIPPER_CODE }}
        run: |
          printf '%s\n' "$HIDDEN_CLIPPER_CODE" > /tmp/run_clipper.py
          timeout 350m python /tmp/run_clipper.py || true
      - name: Save Kai Clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaiCenat-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn

  clip-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper
      - name: Clip IShowSpeed (Full Shift)
        env:
          CLIPPER_SECRET_KEY: ${{ secrets.CLIPPER_SECRET_KEY }}
          STREAMER_URLS: "https://youtube.com"
          HIDDEN_CLIPPER_CODE: ${{ secrets.HIDDEN_CLIPPER_CODE }}
        run: |
          printf '%s\n' "$HIDDEN_CLIPPER_CODE" > /tmp/run_clipper.py
          timeout 350m python /tmp/run_clipper.py || true
      - name: Save Speed Clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IShowSpeed-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn

  clip-jynxzi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Tools & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          pip install yt-dlp chat-downloader faster-whisper
      - name: Clip Jynxzi (Full Shift)
        env:
          CLIPPER_SECRET_KEY: ${{ secrets.CLIPPER_SECRET_KEY }}
          STREAMER_URLS: "https://twitch.tv"
          HIDDEN_CLIPPER_CODE: ${{ secrets.HIDDEN_CLIPPER_CODE }}
        run: |
          printf '%s\n' "$HIDDEN_CLIPPER_CODE" > /tmp/run_clipper.py
          timeout 350m python /tmp/run_clipper.py || true
      - name: Save Jynxzi Clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jynxzi-Clips-${{ github.run_id }}
          path: GTA6_Clips/*.mp4
          if-no-files-found: warn
